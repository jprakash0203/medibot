[project]
name = "medibot"
version = "0.1.0"
description = "MediAssist Health Network - Advanced RAG assistant"
requires-python = ">=3.11"

dependencies = [
    # --- FastAPI stack ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",           # form data for /login

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",   # JWT
    "passlib[bcrypt]>=1.7.4",             # password hashing

    # --- RAG core ---
    "docling>=2.14.0",                    # PDF parsing
    "qdrant-client>=1.12.0",              # vector DB
    "fastembed>=0.4.2",                   # dense + sparse embeddings
    "sentence-transformers>=3.3.0",       # cross-encoder reranker

    # --- LLM + orchestration ---
    "langchain>=0.3.7",
    "langchain-community>=0.3.5",
    "langchain-openai>=0.2.8",            # works with Groq too (OpenAI-compatible)
    "openai>=1.54.0",

    # --- Utilities ---
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",                      # nicer logging
    "httpx>=0.27.2",
    "sqlalchemy>=2.0.36",                 # for SQL RAG connection
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.4",                        # linter (like SpotBugs/Checkstyle)
    "mypy>=1.13.0",                       # type checker
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]